{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
{% load crispy_forms_field %}
<main class="p-5">
    <section class="">
        <div class="container-fluid d-flex align-items-center justify-content-center">
            <div class="col-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="fw-bold my-2 text-center">Edit Profile</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            {{form|crispy }}
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
