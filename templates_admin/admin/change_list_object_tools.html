{% load i18n admin_urls %}

{% block object-tools-items %}
  {% if has_add_permission %}
  <div>
    {% url cl.opts|admin_urlname:'add' as add_url %}
    <a href="{% add_preserved_filters add_url is_popup to_field %}" class="addlink btn btn-secondary">
      <svg width="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M6 12H18M12 6V18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
      {% blocktranslate with cl.opts.verbose_name as name %}
        Add {{ name }}
      {% endblocktranslate %}
    </a>
  </div>
  {% endif %}
{% endblock %}
